<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Modular Route</title>
  <desc id="desc">Rounded modules turn scattered operations into one visible route.</desc>
  <defs>
    <rect id="module" width="18" height="10" rx="5" fill="currentColor"/>
  </defs>
  <g>
    <use href="#module" x="13" y="66" transform="rotate(-34 22 71)"/>
    <use href="#module" x="25" y="50" transform="rotate(-50 34 55)"/>
    <use href="#module" x="38" y="50" transform="rotate(48 47 55)" opacity="0.45"/>
    <use href="#module" x="49" y="62" transform="rotate(-48 58 67)"/>
    <use href="#module" x="60" y="47" transform="rotate(-61 69 52)"/>
    <use href="#module" x="70" y="30" transform="rotate(-61 79 35)"/>
    <use href="#module" x="79" y="16" transform="rotate(-61 88 21)"/>
  </g>
</svg>
