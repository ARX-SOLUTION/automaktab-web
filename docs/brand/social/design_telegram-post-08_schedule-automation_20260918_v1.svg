    <text x="28" y="46" font-family="Manrope, Arial, sans-serif" font-size="23" font-weight="800" letter-spacing="1.2" fill="#F5F7F2">01 · HAFTALIK SHABLON</text>

    <g transform="translate(28 106)" font-family="Manrope, Arial, sans-serif">
      <rect width="374" height="58" rx="14" fill="#EEF2FF" stroke="#2F6BFF" stroke-width="2"/>
      <text x="18" y="36" font-size="21" font-weight="700" fill="#0B1720">Dushanba</text>
      <text x="285" y="36" font-size="21" font-weight="800" fill="#174BC5">14:00</text>

      <rect y="72" width="374" height="58" rx="14" fill="#EEF2FF" stroke="#2F6BFF" stroke-width="2"/>
      <text x="18" y="108" font-size="21" font-weight="700" fill="#0B1720">Chorshanba</text>
      <text x="285" y="108" font-size="21" font-weight="800" fill="#174BC5">14:00</text>

      <rect y="144" width="374" height="58" rx="14" fill="#EEF2FF" stroke="#2F6BFF" stroke-width="2"/>
      <text x="18" y="180" font-size="21" font-weight="700" fill="#0B1720">Juma</text>
      <text x="285" y="180" font-size="21" font-weight="800" fill="#174BC5">14:00</text>
