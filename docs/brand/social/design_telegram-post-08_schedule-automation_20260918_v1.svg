<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Jadvalni qayta-qayta tuzmang</title>
  <desc id="desc">Haftalik jadval shablonidan kelajak haftalari uchun darslarni avtomatik yaratish va mavjud darslarni takror qo‘shmaslik jarayoni.</desc>

  <rect width="1080" height="1350" fill="#F5F7F2"/>

  <g font-family="Manrope, Arial, sans-serif" fill="#0B1720">
    <text x="80" y="92" font-size="22" font-weight="700" letter-spacing="3">AUTOMAKTAB.UZ · NAZORAT OQIMI</text>
    <circle cx="996" cy="84" r="12" fill="#C6FF3D"/>

    <text x="80" y="190" font-size="64" font-weight="800">Jadvalni qayta-qayta</text>
    <text x="80" y="262" font-size="64" font-weight="800">tuzmang.</text>
    <text x="80" y="316" font-size="26" font-weight="500" fill="#31404A">Bir marta shablon. Keyingi haftalar — tayyor.</text>
  </g>

  <g transform="translate(80 382)">
