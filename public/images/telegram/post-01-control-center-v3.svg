<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Rahbar yo‘q. Nazorat bor.</title>
  <desc id="desc">Bo‘sh rahbar kursisi va faol nazorat ekrani orqali avtomaktab rahbari yo‘qligida ham tushum, qarz va xarajat nazoratda qolishini ifodalovchi poster.</desc>

  <defs>
    <linearGradient id="topShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07121A" stop-opacity="0.86"/>
      <stop offset="0.57" stop-color="#07121A" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#07121A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07121A" stop-opacity="0"/>
      <stop offset="1" stop-color="#07121A" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#02070A" flood-opacity="0.4"/>
    </filter>
  </defs>

  <image href="post-01-control-center-v3-bg.png" x="0" y="0" width="1080" height="1350" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="760" fill="url(#topShade)"/>
  <rect y="900" width="1080" height="450" fill="url(#bottomShade)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(76 74)">
      <circle cx="12" cy="12" r="12" fill="#C6FF3D"/>
      <text x="42" y="25" fill="#F5F7F2" font-family="Arial Black, Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="-1.6">automaktab.uz</text>
    </g>

    <g transform="translate(76 166)">
      <rect width="300" height="44" rx="22" fill="#C6FF3D"/>
      <circle cx="23" cy="22" r="5" fill="#0B1720"/>
      <text x="40" y="29" fill="#0B1720" font-size="15" font-weight="800" letter-spacing="1.8">MARKAZ ONLINE</text>
    </g>

    <text x="76" y="330" fill="#F5F7F2" font-family="Arial Black, Arial, sans-serif" font-size="82" font-weight="900" letter-spacing="-3">RAHBAR YO‘Q.</text>
    <text x="76" y="422" fill="#C6FF3D" font-family="Arial Black, Arial, sans-serif" font-size="82" font-weight="900" letter-spacing="-3">NAZORAT BOR.</text>

    <rect x="76" y="474" width="540" height="2" fill="#F5F7F2" opacity="0.28"/>
    <text x="76" y="527" fill="#D5DEE2" font-size="25" font-weight="600" letter-spacing="0.1">Tushum · Qarz · Xarajat — bitta oynada</text>

    <g transform="translate(76 1166)" filter="url(#shadow)">
      <rect width="928" height="106" rx="24" fill="#F5F7F2" fill-opacity="0.96"/>
      <text x="34" y="45" fill="#63717A" font-size="14" font-weight="800" letter-spacing="2.4">RAHBAR UCHUN NAZORAT MARKAZI</text>
      <text x="34" y="80" fill="#0B1720" font-size="25" font-weight="900">@automaktab_uz</text>
      <g transform="translate(795 31)">
        <rect width="99" height="44" rx="22" fill="#C6FF3D"/>
        <path d="M33 22h31M53 12l11 10-11 10" fill="none" stroke="#0B1720" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <text x="1004" y="1112" fill="#F5F7F2" font-size="14" font-weight="800" letter-spacing="2" text-anchor="end" opacity="0.72">POST 01 / 30</text>
  </g>
</svg>
