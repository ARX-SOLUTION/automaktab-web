<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">automaktab.uz — buklangan yo‘l belgisi</title>
  <desc id="desc">Buklangan ko‘k yo‘l tasdiq belgisiga aylanib, avtomaktab boshqaruvi va oldinga harakatni anglatadi.</desc>
