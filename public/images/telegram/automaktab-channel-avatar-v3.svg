      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="1" stop-color="#4CAEFF"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2459C7"/>
      <stop offset="1" stop-color="#0B1720"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="28" dy="34" stdDeviation="30" flood-color="#0B1720" flood-opacity="0.20"/>
    </filter>
    <filter id="floorShadow" x="-100%" y="-200%" width="300%" height="500%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#F5F1EA"/>
